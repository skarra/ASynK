## Docker Compose for ASynK test infrastructure
##
## Usage:
##   docker compose -f test/docker-compose.yml up -d radicale
##   docker compose -f test/docker-compose.yml down
##
## Or from the test/ directory:
##   docker compose up -d radicale
##   docker compose down

services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: asynk-radicale
    ports:
      - "5232:5232"
    volumes:
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
      - radicale-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5232/.web/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  radicale-data:
